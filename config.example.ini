# NXSync configuration
# Folder inside your Nextcloud account for cloud backups; NXSync is the default.
# Created during the first upload. Use the same folder on all NXSync consoles.
# Remote layout: <remote_root>/<device-id>/<profile>/<title-id>/<backup>
remote_root=NXSync

# Optional stable override. Leave blank to use model + final 3 MAC bytes.
# Example: NS-OLED-LIVINGROOM
device_id_override=

# Nextcloud instance root, e.g. https://cloud.example.com/nextcloud
# The complete personal WebDAV URL copied from Nextcloud is also accepted.
nextcloud_url=
nextcloud_username=

# Configure this through the NXSync UI. The value is AES-GCM encrypted and bound
# to the physical console; a blob copied to another console is rejected.
nextcloud_app_password_encrypted=

# true: create only new/changed backups at startup and retry pending uploads.
auto_backup_on_start=false

# Maximum ZIP count per console/profile/game. Default: 5.
retention_count=5
